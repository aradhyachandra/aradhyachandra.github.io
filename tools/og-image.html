<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#fbfaf7;font-family:Inter,sans-serif;color:#1b1d1f}
  .card{box-sizing:border-box;width:1200px;height:630px;padding:84px 96px;display:flex;flex-direction:column;border-left:18px solid #1f5f4a}
  .eyebrow{font:600 22px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:#1f5f4a;margin-bottom:40px}
  h1{font:600 92px/1.05 "Source Serif 4",serif;margin:0 0 28px;letter-spacing:-.01em}
  p{font:600 46px/1.25 "Source Serif 4",serif;margin:0;color:#1b1d1f;max-width:900px}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font:500 26px/1.3 Inter;color:#5a5f66}
  .mono{width:96px;height:96px;border-radius:50%;background:#e6f0eb;color:#1f5f4a;display:grid;place-items:center;font:600 40px/1 "Source Serif 4",serif}
</style></head>
<body><div class="card">
  <div class="eyebrow">Analytics portfolio</div>
  <h1>Aradhya Chandra</h1>
  <p>I turn messy data into business decisions.</p>
  <div class="foot"><span>B.Tech CSE, Shiv Nadar University<br>aradhyachandra.github.io</span><div class="mono">AC</div></div>
</div></body></html>
